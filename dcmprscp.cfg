# ============================================================================
#  SL Diagnostics - DICOM Print SCP config (dcmprscp)
#  AE Title : PDF_DICOM     Port : 1122
#  Folder   : C:/xampp/htdocs/dicom_print
# ============================================================================

[[GENERAL]]

[APPLICATION]
LogDirectory = C:/xampp/htdocs/dicom_print/data/log
LogFile = printscp.log
LogLevel = INFO
MessagePort = 0
KeepMessagePortOpen = false

[PRINT]
Server = dcmprscp
Directory = C:/xampp/htdocs/dicom_print/data/spool
DetailedLog = true
BinaryLog = false
DeletePrintJobs = false
AlwaysDeleteTerminateJobs = true

[DATABASE]
# Received prints (Hardcopy images) are saved here -> watcher.js makes PDF
Directory = C:/xampp/htdocs/dicom_print/data/database

[LUT]
Directory = C:/xampp/htdocs/dicom_print/data/lut

[NETWORK]
aetitle = PDF_DICOM

# ============================================================================
[[COMMUNICATION]]
# ============================================================================

[PDF_DICOM]
Type = LOCALPRINTER
Aetitle = PDF_DICOM
Description = SL Diagnostics DICOM Print to PDF
Hostname = localhost
Port = 1122
Protocol = AF_INET
MaxPDU = 32768
ImplicitOnly = false
DisableNewVRs = false

# What the printer accepts (wide list so most modalities connect)
DisplayFormat = 1,1\1,2\2,1\2,2\2,3\3,2\3,3\3,4\3,5\4,4\4,5\4,6\5,5\5,6\6,6
FilmSizeID = 14INX17IN\8INX10IN\10INX12IN\10INX14IN\11INX14IN\14INX14IN\24CMX24CM\24CMX30CM\A4\A3
MediumType = BLUE FILM\CLEAR FILM\PAPER
FilmDestination = PROCESSOR\MAGAZINE\BIN_1\BIN_2
MagnificationType = REPLICATE\BILINEAR\CUBIC\NONE
SmoothingType = NONE
BorderDensity = BLACK\WHITE\150\20
EmptyImageDensity = BLACK\WHITE\20
MaxDensity = 320
MinDensity = 20
ResolutionID = STANDARD\HIGH

Supports12Bit = true
SupportsPresentationLUT = true
PresentationLUTMatchRequired = false
PresentationLUTinFilmSession = false
SupportsDecimateCrop = true
SupportsImageSize = true
SupportsTrim = true
OmitSOPClassUIDFromCreateResponse = false